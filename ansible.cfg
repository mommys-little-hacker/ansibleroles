[defaults]
; Каталоги с ролями: локальный roles/ этого репозитория
roles_path = roles
interpreter_python = auto_silent
deprecation_warnings = True
; Секреты: ansible-vault. Пароль vault хранится ВНЕ репозитория.
; vault_password_file = ~/.config/qwertys/vault_pass

[galaxy]
; Внешние зависимости ставятся из requirements.yml
; server = https://galaxy.ansible.com
