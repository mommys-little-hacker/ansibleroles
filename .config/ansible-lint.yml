---
# Конфигурация ansible-lint
exclude_paths:
  - .cache/
  - .molecule/

# Правила, которые отключены полностью (не добавлять без обсуждения)
# galaxy[no-license]: коллекция закрытая (частное использование, публикация в
# Galaxy не планируется), поле license в galaxy.yml удалено по решению
# владельца (2026-10-29, TASK-002), поэтому требование лицензии подавлено.
skip_list:
  - galaxy[no-license]

# Предупреждения (не ломают CI)
warn_list:
  - experimental
