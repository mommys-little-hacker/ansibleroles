---
# Метаданные Ansible-коллекции. Роли лежат в roles/, устанавливаются как
# коллекция целиком: ansible-galaxy collection install git+ssh://<url>.
# При выпуске тега vX.Y.Z синхронно поднимайте version здесь.
namespace: qwertys
name: roles
version: 1.0.0
readme: README.md
authors:
  - Maxim Vasilev <admin@qwertys.ru>
license:
  - EULA
description: Ansible roles for qwertys.ru infrastructure (targeted at Debian 13)
repository: git@github.com:mommys-little-hacker/ansibleroles.git
# Коллекции, используемые ролями (common: community.general.timezone,
# ansible.posix.sysctl). Ставятся автоматически вместе с коллекцией.
dependencies:
  ansible.posix: ">=1.0.0"
  community.general: ">=8.0.0"
tags:
  - infrastructure
  - debian
  - linux
build_ignore:
  - .ansibleroles
  - .cache
  - .config
  - docs
  - playbooks
  - scripts
  - AGENTS.md
  - ansible.cfg
  - requirements.yml
