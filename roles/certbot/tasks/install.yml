---
- name: Ensure all required packages are installed
  ansible.builtin.apt:
    name:
      - virtualenv
      - cron
    update_cache: false
- name: Create virtualenv and install certbot
  ansible.builtin.pip:
    name: "{{ certbot_pip }}"
    virtualenv: "/opt/certbot"
    virtualenv_python: "/usr/bin/python3"
