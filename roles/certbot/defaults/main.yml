---
certbot_version: 4.2.0
certbot_email: admin@localhost

certbot_skip: false

certbot_deploy_hooks:
  - nginx_reload.sh

certbot_pre_hooks:
  - nginx_stop.sh

certbot_post_hooks:
  - nginx_start.sh

