---
- name: Add Docker repo key
  ansible.builtin.apt_key:
    url: "{{ docker_apt.repo_key }}"
    state: present
- name: Add Docker repo
  ansible.builtin.apt_repository:
    repo: "{{ docker_apt.repo_line }}"
    state: present
    filename: docker
- name: Install docker package
  ansible.builtin.apt:
    name:
      - "{{ docker_apt.package }}={{ docker_apt.version }}"
      - python3-docker
    update_cache: false
- name: Install docker python lib
  ansible.builtin.apt:
    name:
      - python3-docker
    update_cache: false
  when: not docker_pip.force
- name: Install docker python lib
  ansible.builtin.pip:
    name:
      - "{{ docker_pip.package }}=={{ docker_pip.version }}"
    executable: /usr/bin/pip3
    break_system_packages: true
    state: present
  when: docker_pip.force
- name: Re-gather network facts
  ansible.builtin.setup:
    gather_subset: network
