---
- name: "Create user {{ item.name }}"
  ansible.builtin.user:
    name: "{{ item.name }}"
    password: ""
    groups: "{{ item.groups }}"
    shell: "{{ item.shell }}"
    comment: "{{ item.comment }}"
    update_password: on_create
    append: true
    umask: "027"
- name: "Add SSH keys for user {{ item.name }}"
  no_log: true
  ansible.posix.authorized_key:
    user: "{{ item.name }}"
    key: "{{ pubkey }}"
    state: present
  loop: "{{ item.pubkeys }}"
  loop_control:
    loop_var: pubkey
- name: "Ensure permissions for home folder for {{ item.name }}"
  ansible.builtin.file:
    path: "/home/{{ item.name }}"
    state: directory
    mode: "0750"
- name: "Create sudoers file for {{ item.name }}"
  no_log: true
  ansible.builtin.copy:
    dest: "/etc/sudoers.d/{{ item.name }}"
    content: "{{ item.name }} ALL=(ALL) NOPASSWD:ALL"
    owner: root
    group: root
    mode: "0440"
  when:
    - item.root_sudo is defined
    - item.root_sudo
