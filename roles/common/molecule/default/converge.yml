---
- name: Converge
  hosts: all
  vars:
    common_users_create:
      - name: test1
        comment: test account
        shell: /bin/bash
        groups:
          - sudo
          - adm
        root_sudo: true
        pubkeys:
          - ssh-rsa qqqwwweeerrrtttyyy invalid
      - name: test2
        comment: test account
        shell: /bin/bash
        groups:
          - sudo
        root_sudo: true
        pubkeys:
          - ssh-rsa qqqwwweeerrrtttyyy invalid
    common_users_delete:
      - name: test1
        remove_files: false
  tasks:
    - name: Edit hostname # noqa 301 305
      ansible.builtin.shell:
        cmd: "hostnamectl set-hostname instance.local"
    - name: "Include common"
      ansible.builtin.include_role:
        name: "common"
